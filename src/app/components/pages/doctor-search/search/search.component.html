<div class="app-container">
  <app-navbar></app-navbar>
  <div class="content-wrapper">
    <app-menu></app-menu>
    <div class="page-container">
      <div class="card flex justify-content-center mt-7">
        <p-breadcrumb class="max-w-full" [model]="items">
          <ng-template pTemplate="item" let-item let-last="last">
            <ng-container *ngIf="item.route; else elseBlock">
              <a [routerLink]="item.route" class="p-menuitem-link" routerLinkActive="text-primary font-semibold"
                [routerLinkActiveOptions]="{exact: true}">
                <span [ngClass]="[item.icon ? item.icon : '', 'text-color']"></span>
                <span class="text-color">{{ item.label }}</span>
              </a>
            </ng-container>
            <ng-template #elseBlock>
              <a [href]="item.url">
                <span class="text-color">{{ item.label }}</span>
              </a>
            </ng-template>
          </ng-template>
        </p-breadcrumb>
      </div>

      <div class="content-container">
        <div class="search-filter-container">
          <app-search-filter></app-search-filter>
        </div>

        <div class="doctor-cards-container">
          <div *ngFor="let doctor of paginatedDoctors" class="doctor-card">
            <app-search-card [doctor]="doctor"></app-search-card>
          </div>

          <p-paginator [rows]="5" [totalRecords]="doctors.length" (onPageChange)="paginate($event)"></p-paginator>
        </div>
      </div>
    </div>
  </div>
</div>
